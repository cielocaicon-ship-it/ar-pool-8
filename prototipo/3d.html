<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Pool 8 · Vista 3D</title>
<link rel="stylesheet" href="css/styles.css">
<script src="lib/aframe.min.js"></script>
</head>
<body data-mode="3d">
<div id="ui">
  <div>
    <header class="glass"><a href="index.html">🎱 AR POOL 8</a><span id="status">Cargando…</span><button id="toggleUI" class="mini" aria-label="Mostrar u ocultar controles">☰</button></header>
    <div id="errors" hidden></div>
  </div>
  <div id="info" class="glass">Cargando…</div>
  <div class="panel glass">
    <div class="row">
      <button id="aimL" class="mini" aria-label="Girar a la izquierda">◀</button>
      <label class="grow">Dirección <span id="angleValue">0.0°</span><input id="angle" type="range" min="-180" max="180" step="0.5" value="0"></label>
      <button id="aimR" class="mini" aria-label="Girar a la derecha">▶</button>
    </div>
    <div class="row"><label class="grow">Potencia <span id="powerValue">40%</span><input id="power" type="range" min="1" max="100" value="40"></label></div>
    <div class="row keep">
      <button id="shoot" class="primary">🎱 GOLPEAR</button>
      <button id="bot">🤖 Bot</button>
      <select id="level" aria-label="Nivel del bot"><option value="0">Fácil</option><option value="1" selected>Medio</option><option value="2">Difícil</option></select>
      <button id="reset" aria-label="Reiniciar">↻</button>
    </div>
    <div class="row">
      <button id="camFollow">🎯 Detrás del taco</button><button id="camTop">⬇ Superior</button>
      <a href="ar.html" style="margin-left:auto;font-size:13px">Modo AR</a>
    </div>
    <p id="help">Toca la mesa para apuntar. Arrastra para girar la cámara y pellizca para acercar. ◀ ▶ ajustan la dirección con precisión.</p>
  </div>
</div>

<a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false" device-orientation-permission-ui="enabled: false"
  renderer="antialias: true; colorManagement: true" background="color: #0d1418">
  <a-entity id="tableRoot" position="0 0.8 0"></a-entity>
  <a-entity id="cam" camera="fov: 55" position="-2 1.6 0"></a-entity>
  <a-entity light="type: ambient; intensity: 0.45"></a-entity>
  <a-entity light="type: directional; intensity: 0.8" position="1 4 2"></a-entity>
  <a-entity light="type: point; intensity: 0.9; distance: 6; decay: 1" position="0 1.75 0"></a-entity>
</a-scene>
<script src="js/game.js"></script>
</body>
</html>
